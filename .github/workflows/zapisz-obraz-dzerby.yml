name: Jednorazowo zapisz obraz Dżerby w repozytorium

on:
  push:
    paths:
      - '.github/workflows/zapisz-obraz-dzerby.yml'

permissions:
  contents: write

jobs:
  zapisz:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Pobierz używany obraz z Wikimedia Commons
        run: |
          mkdir -p assets/images
          curl --fail --location --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Djerba_Island.jpeg/1280px-Djerba_Island.jpeg' \
            --output assets/images/djerba-island-landsat-2020.jpg
          test -s assets/images/djerba-island-landsat-2020.jpg

      - name: Przełącz stronę na lokalny obraz i uaktualnij dokumentację
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.md')
          text = index.read_text(encoding='utf-8')
          old = 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Djerba_Island.jpeg/1280px-Djerba_Island.jpeg'
          new = 'assets/images/djerba-island-landsat-2020.jpg'
          if old not in text:
              raise SystemExit('Nie znaleziono oczekiwanego zewnętrznego adresu obrazu w index.md')
          index.write_text(text.replace(old, new, 1), encoding='utf-8')

          doc = Path('techniczne/wizualizacje/README.md')
          text = doc.read_text(encoding='utf-8')
          old = 'Obraz jest obecnie osadzony z Wikimedia Commons w sekcji `home-hero`. Ma rozbudowany tekst alternatywny opisujący kształt wyspy i najważniejsze elementy orientacyjne, podpis oraz osobną informację o autorstwie i źródle na dole strony.'
          new = 'Kopia obrazu używana na stronie jest przechowywana lokalnie w repozytorium jako `assets/images/djerba-island-landsat-2020.jpg` i osadzona w sekcji `home-hero`. Wikimedia Commons pozostaje wskazane jako miejsce pozyskania i źródło informacji o pochodzeniu. Obraz ma rozbudowany tekst alternatywny opisujący kształt wyspy i najważniejsze elementy orientacyjne, podpis oraz osobną informację o autorstwie i źródle na dole strony.'
          if old not in text:
              raise SystemExit('Nie znaleziono oczekiwanego opisu w dokumentacji wizualizacji')
          doc.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Usuń jednorazowy workflow i zapisz wynik
        run: |
          git rm .github/workflows/zapisz-obraz-dzerby.yml
          git config user.name 'Mikołaj Rotnicki'
          git config user.email 'rotnicki@users.noreply.github.com'
          git add assets/images/djerba-island-landsat-2020.jpg index.md techniczne/wizualizacje/README.md
          git commit -m 'Zapisz obraz Dżerby lokalnie w repozytorium'
          git push origin master
