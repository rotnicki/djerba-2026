name: Jednorazowa korekta dokumentacji zdjęć

on:
  push:
    paths:
      - '.github/workflows/patch-cleanup-2026-09-05.yml'

permissions:
  contents: write

jobs:
  patch-journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skoryguj dziennik
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('techniczne/dziennik-podrozy.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '',
                  ''
              ),
              (
                  'IyMjIFpkasSZY2lhLCBuYWdyYW5pYSBpIG1hdGVyaWHFgnkKCiMjIDUgd3J6ZcWbbmlhIDIwMjY=',
                  ''
              ),
          ]

          for old_b64, new_b64 in replacements:
              old = base64.b64decode(old_b64).decode('utf-8')
              new = base64.b64decode(new_b64).decode('utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Oczekiwano dokładnie jednego dopasowania, znaleziono: {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Zapisz zmianę
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add techniczne/dziennik-podrozy.md
          git diff --cached --check
          git commit -m "Skoryguj stan materiałów z 2 i 4 września"
          git push
