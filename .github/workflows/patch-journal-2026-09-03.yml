name: Jednorazowe uzupełnienie mapowania zdjęć 3 września

on:
  push:
    paths:
      - '.github/workflows/patch-journal-2026-09-03.yml'

permissions:
  contents: write

jobs:
  patch-journal:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Uzupełnij dziennik
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('techniczne/dziennik-podrozy.md')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode('LSBTZWxla2NqYSBtYXRlcmlhxYLDs3cgeiAzIHdyemXFm25pYSBuaWUgem9zdGHFgmEgamVzemN6ZSB6YXR3aWVyZHpvbmEuIMW7YWRlbiBwbGlrIHogdGVqIHBhcnRpaSBuaWUgem9zdGHFgiBuYSB0eW0gZXRhcGllIHByemVtaWFub3dhbnkgYW5pIHVzdW5pxJl0eS4=').decode('utf-8')
          new = base64.b64decode('').decode('utf-8')

          if old not in text:
              raise SystemExit('Nie znaleziono dokładnego starego wpisu — przerwano bez zmian.')
          if '#### Zatwierdzone mapowanie nazw — 3 września' in text:
              raise SystemExit('Sekcja już istnieje — przerwano bez zmian.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Zapisz zmianę
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add techniczne/dziennik-podrozy.md
          git diff --cached --check
          git commit -m "Dodaj mapowanie zdjęć z 3 września"
          git push
